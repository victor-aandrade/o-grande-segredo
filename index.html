
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8f1e7">
  <title>O Grande Segredo</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <main class="tela-inicial">
    <section class="conteudo">
      <div class="mascotes-inicial" aria-label="Ilustrações de bebês fofos">
        <img src="/images/bebe-azul.svg" alt="Bebê vestido de azul">
        <img src="/images/bebe-rosa.svg" alt="Bebê vestido de rosa">
      </div>

      <h1>O Grande Segredo</h1>

      <p class="subtitulo">
        Uma aventura está prestes a começar...
      </p>

      <p class="descricao">
        Um segredo foi guardado.<br>
        Agora chegou a hora de descobrir a verdade.
      </p>

      <div class="botoes">
        <button id="btnGuardia" class="botao botao-guardia">
          Guardiã do Segredo
        </button>

        <button id="btnJogar" class="botao botao-jogar">
          Quero Jogar
        </button>
      </div>
    </section>
  </main>

  <script type="module" src="/src/main.js"></script>
  
<footer style="text-align: center; padding: 24px    12px; font-size: 14px;">
  <a href="/privacidade.html">Política de Privacidade</a>
</footer>

</body>
</html>
